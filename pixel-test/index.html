<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thanksgiving at SpaceX — banquet hall pixel test</title>
  <meta name="description" content="A code-drawn pixel-art style test of the Thanksgiving banquet hall. Scroll to zoom by whole pixels.">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #14110e;
      color: #f3e6d0;
      overflow: hidden;
    }
    #stage {
      position: absolute;
      left: 0;
      top: 0;
      cursor: grab;
    }
    #stage:active { cursor: grabbing; }
    canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #14110e;
    }
    #hud {
      position: fixed;
      left: 14px;
      top: 12px;
      max-width: 46rem;
      font: 13px/1.45 ui-sans-serif, system-ui, sans-serif;
      text-shadow: 0 1px 0 #000;
      pointer-events: none;
    }
    #hud h1 {
      margin: 0 0 2px;
      font-size: 15px;
      font-weight: 650;
      letter-spacing: 0.01em;
    }
    #hud p { margin: 0; opacity: 0.86; }
    #hud.hidden { display: none; }
  </style>
</head>
<body>
  <div id="stage"><canvas id="view" aria-label="Animated pixel-art cutaway of a Thanksgiving banquet hall at SpaceX. Scroll to zoom by whole pixels. Drag to pan."></canvas></div>
  <div id="hud">
    <h1>Thanksgiving at SpaceX · banquet hall</h1>
    <p>Scroll zooms by whole pixels. Drag pans. Double-click recenters. Space pauses. Arrows step. H hides this. S saves a 3× PNG.</p>
    <p id="readout"></p>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
